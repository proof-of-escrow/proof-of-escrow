<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Proof of Escrow</title>
  <!-- Shackle: a time ring. The muted track is the whole lock; the lit arc is the time still to run. -->
  <path d="M164 248 V196 A92 92 0 0 1 348 196 V248" fill="none" stroke="#F2EEE6" stroke-opacity="0.18" stroke-width="40" stroke-linecap="round"/>
  <path d="M164 248 V196 A92 92 0 0 1 320 130" fill="none" stroke="#F0B44C" stroke-width="40" stroke-linecap="round"/>
  <!-- Body: the escrow. -->
  <rect x="120" y="236" width="272" height="196" rx="44" fill="#F2EEE6"/>
  <!-- One mark on the body: the unlock date. -->
  <rect x="240" y="300" width="32" height="68" rx="16" fill="#0E1014"/>
</svg>
